<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop manager · VOIDD</title>
  <link rel="stylesheet" href="gold.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top">
        <a class="mark" href="index.html"><span class="ring" aria-hidden="true"></span>VOIDD</a>
        <nav>
          <a href="store.html">Shop</a>
          <a href="manager.html" aria-current="page">Manager</a>
        </nav>
      </div>
      <p class="place">API</p>
      <h1>Catalog manager.</h1>
      <p class="lede">Reads <code>api/products.json</code>. Edit Gumroad URLs here, download JSON, commit it. Pages cannot write itself.</p>
    </header>
    <main>
      <p class="place" id="meta">loading</p>
      <div id="rows" class="farm-grid"></div>
      <p style="margin-top:1rem">
        <button class="btn" id="dl" type="button">Download products.json</button>
        <a class="btn ghost" href="api/products.json">Raw API</a>
      </p>
    </main>
  </div>
  <script>
  let data={products:[]};
  const rows=document.getElementById("rows");
  function paint(){
    rows.innerHTML=data.products.map((p,i)=>`
      <div class="t" data-i="${i}">
        <h2>${p.id}</h2>
        <input data-k="title" value="${p.title||""}">
        <input data-k="tag" value="${p.tag||""}">
        <input data-k="price" type="number" value="${p.price||0}">
        <input data-k="blurb" value="${p.blurb||""}">
        <input data-k="play" value="${p.play||""}" placeholder="play/.html">
        <input data-k="gumroad" value="${p.gumroad||""}" placeholder="https://gumroad.com/l/...">
      </div>`).join("");
    rows.querySelectorAll(".t").forEach(box=>{
      box.querySelectorAll("input").forEach(inp=>{
        inp.oninput=()=>{
          const i=+box.dataset.i, k=inp.dataset.k;
          data.products[i][k]=k==="price"?+inp.value:inp.value;
        };
      });
    });
  }
  fetch("api/products.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
    data=d;
    document.getElementById("meta").textContent="v"+d.version+" · "+d.updated+" · "+d.products.length+" SKUs";
    paint();
  });
  document.getElementById("dl").onclick=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="products.json";
    a.click();
  };
  </script>
</body>
</html>
