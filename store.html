<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03040a">
  <title>Shop · VOIDD Labs</title>
  <link rel="canonical" href="https://kawhooped.github.io/voidd-sales/store.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gold.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top">
        <a class="mark" href="index.html"><span class="ring" aria-hidden="true"></span>VOIDD</a>
        <nav>
          <a href="index.html">Work</a>
          <a href="farm.html">Tools</a>
          <a href="blog.html">Blog</a>
          <a href="store.html" aria-current="page">Shop</a>
          <a href="codeshelf.html">CodeShelf</a>
        </nav>
      </div>
      <p class="place">Shop</p>
      <h1>Carts for sale.</h1>
      <p class="lede">Play here. Pay on Gumroad when the button is live. Same SKU, not a second store. Full pack list lives in <a href="codeshelf.html">CodeShelf</a>.</p>
    </header>
    <main>
      <div class="grid" id="shelf"></div>
    </main>
    <footer>
      <span>VOIDD Labs</span>
      <a href="codeshelf.html">CodeShelf</a>
      <a href="manager.html">Manager</a>
      <a href="license.html">License</a>
    </footer>
  </div>
  <script>
  const FALLBACK = {
    products: [
      {id:"ghost-turk",title:"Ghost Turk",tag:"Play + $7",price:7,blurb:"Move one. Purps multiply. Ghosts never die.",play:"play/ghost-turk.html",gumroad:""},
      {id:"dignity-sweep",title:"Dignity Sweep",tag:"Play",price:0,blurb:"Hold to vacuum coins. Robbers clip the lane.",play:"play/dignity-sweep.html",gumroad:""},
      {id:"arcade-pack",title:"VOIDD Arcade Pack",tag:"$19",price:19,blurb:"Ghost Turk + Dignity Sweep + Night Lanes.",play:"play/ghost-turk.html",gumroad:""},
      {id:"studio-kit",title:"VOIDD Studio Kit",tag:"$29",price:29,blurb:"Starter page, HUD tokens, grid kernel, GDD.",play:"",gumroad:""},
      {id:"facades",title:"VOID CITY FACADES VOL.1",tag:"$29",price:29,blurb:"15 tileable 4K cyberpunk facade materials.",play:"",gumroad:""}
    ]
  };

  function paint(data, note){
    const el = document.getElementById("shelf");
    const extra = `<article class="tile"><span class="n">All</span><h2>CodeShelf</h2><p>Ten artifacts. Search, sort, local notes. Buy buttons open Gumroad.</p><a class="btn" href="codeshelf.html">Open snapshot</a></article>`;
    const cards = (data.products || []).map(p => {
      const play = p.play ? `<a class="btn" href="${p.play}">Play</a>` : "";
      const buy = p.gumroad
        ? `<a class="btn ghost" href="${p.gumroad}">Buy $${p.price}</a>`
        : (p.price ? `<span class="btn ghost">$${p.price} · Gumroad soon</span>` : "");
      return `<article class="tile"><span class="n">${p.tag || "SKU"}</span><h2>${p.title}</h2><p>${p.blurb || ""}</p><div style="display:flex;flex-wrap:wrap;gap:8px">${play}${buy}</div></article>`;
    }).join("");
    el.innerHTML = extra + cards + (note ? `<article class="tile"><span class="n">Note</span><h2>Catalog source</h2><p>${note}</p></article>` : "");
  }

  async function load(){
    paint(FALLBACK, "");
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);
    try {
      const r = await fetch("api/products.json", { cache: "no-store", signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (!data || !Array.isArray(data.products) || !data.products.length) throw new Error("empty");
      paint(data, "");
    } catch (e) {
      clearTimeout(t);
      paint(FALLBACK, "Live list timed out. Showing the built-in shelf. CodeShelf still works.");
    }
  }
  load();
  </script>
</body>
</html>
