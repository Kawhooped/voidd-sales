<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03040a">
  <title>Shop · VOIDD Labs</title>
  <link rel="canonical" href="https://kawhooped.github.io/voidd-sales/store.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gold.css">
  <script src="https://gumroad.com/js/gumroad.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top">
        <a class="mark" href="index.html"><span class="ring" aria-hidden="true"></span>VOIDD</a>
        <nav>
          <a href="index.html">Work</a>
          <a href="farm.html">Tools</a>
          <a href="blog.html">Blog</a>
          <a href="store.html" aria-current="page">Shop</a>
          <a href="codeshelf.html">CodeShelf</a>
        </nav>
      </div>
      <p class="place">Shop</p>
      <h1>Shop.</h1>
      <p class="lede">Play here. Pay on Gumroad in this tab. Same SKUs as <a href="codeshelf.html">CodeShelf</a>.</p>
    </header>
    <main>
      <div class="grid" id="shelf"></div>
    </main>
    <footer>
      <span>VOIDD Labs</span>
      <a href="codeshelf.html">CodeShelf</a>
      <a href="manager.html">Manager</a>
      <a href="license.html">License</a>
    </footer>
  </div>
  <script>
  const FALLBACK = {
    products: [
      {id:"ghost-turk",title:"Ghost Turk",tag:"Play",price:0,blurb:"Move one. Purps multiply. Ghosts never die.",play:"play/ghost-turk.html",gumroad:""},
      {id:"dignity-sweep",title:"Dignity Sweep",tag:"Play",price:0,blurb:"Hold to vacuum coins. Robbers clip the lane.",play:"play/dignity-sweep.html",gumroad:""},
      {id:"after-hours",title:"After-Hours Lead Pack",tag:"$47",price:47,blurb:"DIY chat + lead-capture kit for six niches.",gumroad:"https://gimminomi.gumroad.com/l/bhifxl"},
      {id:"upper-mgmt",title:"UPPER MANAGEMENT",tag:"$9",price:9,blurb:"Org / upper-management sim toy.",gumroad:"https://gimminomi.gumroad.com/l/upper-management-sim"},
      {id:"asset-factory",title:"ASSET FACTORY CONSOLE",tag:"$12",price:12,blurb:"Listing and asset desk energy in one HTML.",gumroad:"https://gimminomi.gumroad.com/l/asset-factory-console"},
      {id:"vector-forge-living",title:"VECTOR FORGE LIVING",tag:"$12",price:12,blurb:"Generative motion in one offline HTML.",gumroad:"https://gimminomi.gumroad.com/l/vector-forge-living"},
      {id:"cockpit-pack",title:"COCKPIT PACK",tag:"$15",price:15,blurb:"Showrunner + Ship Dashboard + Horizon + Hearth.",gumroad:"https://gimminomi.gumroad.com/l/voidd-cockpit-pack"},
      {id:"court-pack",title:"COURT PACK",tag:"$15",price:15,blurb:"Whisper Court + King's Hours + Core + Coalition + Young King.",gumroad:"https://gimminomi.gumroad.com/l/voidd-court-pack"},
      {id:"nudge-lab-pack",title:"NUDGE LAB PACK",tag:"$15",price:15,blurb:"Four nudge/field toys: cosmos, biome, arena, lab.",gumroad:"https://gimminomi.gumroad.com/l/voidd-nudge-lab-pack"},
      {id:"arena-pack",title:"ARENA PACK",tag:"$19",price:19,blurb:"Angels vs Demons + Blade Instinct + Platform Command + Emoji Soccer.",gumroad:"https://gimminomi.gumroad.com/l/voidd-arena-pack"},
      {id:"creative-pack",title:"CREATIVE PACK",tag:"$19",price:19,blurb:"Vector Forge + Loom + Draws + The Forge + Ember.",gumroad:"https://gimminomi.gumroad.com/l/voidd-creative-pack"},
      {id:"play-wave-pack",title:"PLAY WAVE PACK",tag:"$19",price:19,blurb:"Oculus + Ascent Arcade + Draws.",gumroad:"https://gimminomi.gumroad.com/l/voidd-play-wave-pack"}
    ]
  };

  function buyBtn(p){
    if (p.gumroad) {
      const label = p.price ? ("Buy $" + p.price) : "Buy";
      return `<a class="btn gumroad-button" href="${p.gumroad}">${label}</a>`;
    }
    if (p.wixPath) {
      return `<a class="btn ghost" href="https://www.void.works${p.wixPath}" target="_blank" rel="noopener">Buy on Wix $${p.price}</a>`;
    }
    if (p.price) return `<span class="btn ghost">$${p.price} · checkout later</span>`;
    return "";
  }

  function paint(data, note){
    const el = document.getElementById("shelf");
    const extra = `<article class="tile"><span class="n">All</span><h2>CodeShelf</h2><p>Same ten packs. Search and local notes.</p><a class="btn ghost" href="codeshelf.html">Open snapshot</a></article>`;
    const cards = (data.products || []).map(p => {
      const play = p.play ? `<a class="btn ghost" href="${p.play}">Play</a>` : "";
      return `<article class="tile"><span class="n">${p.tag || "SKU"}</span><h2>${p.title}</h2><p>${p.blurb || ""}</p><div style="display:flex;flex-wrap:wrap;gap:8px">${play}${buyBtn(p)}</div></article>`;
    }).join("");
    el.innerHTML = extra + cards + (note ? `<article class="tile"><span class="n">Note</span><h2>Catalog source</h2><p>${note}</p></article>` : "");
  }

  async function load(){
    paint(FALLBACK, "");
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);
    try {
      const r = await fetch("api/products.json", { cache: "no-store", signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (!data || !Array.isArray(data.products) || !data.products.length) throw new Error("empty");
      paint(data, "");
    } catch (e) {
      clearTimeout(t);
      paint(FALLBACK, "Live list timed out. Showing the built-in shelf.");
    }
  }
  load();
  </script>
</body>
</html>
