<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03040a">
  <meta name="robots" content="noindex">
  <title>Database · VOIDD Labs</title>
  <link rel="canonical" href="https://kawhooped.github.io/voidd-sales/db.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gold.css">
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:.55rem; margin:1.1rem 0 .4rem; align-items:center; }
    .bar input, .bar select { flex:1; min-width:10rem; }
    .kinds { display:flex; flex-wrap:wrap; gap:.35rem; margin:.4rem 0 1rem; }
    .kinds button {
      min-height:2.3rem; padding:0 .7rem; border-radius:999px; cursor:pointer;
      border:1px solid var(--line); background:#090c14; color:var(--dim); font:inherit;
    }
    .kinds button.on, .kinds button:hover { color:var(--ink); border-color:#3a4158; }
    .shelf { display:grid; gap:.7rem; grid-template-columns:repeat(auto-fill,minmax(min(100%,16.5rem),1fr)); }
    .card { background:linear-gradient(145deg,#0b0f18,#06080e); border:1px solid var(--line); border-radius:14px; padding:.9rem; display:flex; flex-direction:column; gap:.35rem; }
    .card .k { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
    .card h2 { margin:0; font-size:1.05rem; }
    .card p { margin:0; color:var(--dim); font-size:.92rem; flex:1; }
    .card .prev { width:48px; height:48px; object-fit:contain; border-radius:8px; background:#05070d; border:1px solid var(--line); }
    .card .row { display:flex; gap:.55rem; align-items:center; }
    .card .links { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.35rem; }
    .card .links a, .card .links button { min-height:2.2rem; }
    .count { color:var(--muted2); font-size:.8rem; }
  </style>
</head>
<body>
  <a class="skip" href="#shelf">Skip to shelf</a>
  <div class="wrap wide">
    <header>
      <div class="top">
        <a class="mark" href="index.html"><span class="ring" aria-hidden="true"></span>VOIDD</a>
        <nav>
          <a href="index.html">Work</a>
          <a href="tools/index.html">Tools</a>
          <a href="store.html">Shop</a>
          <a href="db.html" aria-current="page">Database</a>
        </nav>
      </div>
      <p class="place">Catalog</p>
      <h1>Database.</h1>
      <p class="lede">Public pages, games, and packs. Search and open them.</p>
    </header>
    <main>
      <div class="bar">
        <input id="q" type="search" placeholder="Find a mark, page, pack…">
        <select id="sort">
          <option value="kind">Kind</option>
          <option value="name">Name</option>
        </select>
        <span class="count" id="count"></span>
      </div>
      <div class="kinds" id="kinds"></div>
      <div class="shelf" id="shelf"></div>
    </main>
    <footer>
      <span>VOIDD Labs</span>
      <a href="license.html">License</a>
    </footer>
  </div>
<script>
const KIND_ALL = "all";
let lib = { items: [], kinds: ["mark","icon","color","page","game","tool","pack","html","note"] };
let kind = KIND_ALL;
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&","<":"<",">":">","\"":"""}[c])); }
function isPublic(it){
  if (it.visibility === "inside") return false;
  if (it.visibility === "public") return true;
  return it.status === "live" || it.status === "for-sale";
}
function allItems(){ return (lib.items || []).filter(isPublic); }
function paintKinds(){
  const used = [KIND_ALL].concat(lib.kinds || []);
  document.getElementById("kinds").innerHTML = used.map(k =>
    `<button type="button" data-k="${esc(k)}" class="${k===kind?"on":""}">${esc(k)}</button>`
  ).join("");
}
function paint(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  let list = allItems().filter(it => {
    if (kind !== KIND_ALL && it.kind !== kind) return false;
    const blob = [it.title, it.note, it.where, it.file, it.url, it.kind, (it.use_on||[]).join(" ")].join(" ").toLowerCase();
    return !q || blob.includes(q);
  });
  if (sort === "name") list.sort((a,b)=>String(a.title).localeCompare(String(b.title)));
  else list.sort((a,b)=>String(a.kind).localeCompare(String(b.kind)) || String(a.title).localeCompare(String(b.title)));
  document.getElementById("count").textContent = list.length + " items";
  document.getElementById("shelf").innerHTML = list.length ? list.map(it => {
    const href = it.url || it.file || "";
    const prev = it.preview || (/\.(svg|png|jpe?g|webp)$/i.test(it.file||"") ? it.file : "");
    return `<article class="card">
      <div class="row">
        ${prev ? `<img class="prev" alt="" src="${esc(prev)}">` : ""}
        <div>
          <div class="k">${esc(it.kind)}</div>
          <h2>${esc(it.title)}</h2>
        </div>
      </div>
      <p>${esc(it.note || it.where || "")}</p>
      <div class="links">
        ${href ? `<a class="btn ghost" href="${esc(href)}">${it.url && /^https?:/.test(it.url) ? "Open" : "File"}</a>` : ""}
        ${it.file && it.file !== href ? `<a class="btn ghost" href="${esc(it.file)}">${esc(it.file)}</a>` : ""}
      </div>
    </article>`;
  }).join("") : `<article class="card"><div class="k">none</div><h2>Nothing matches</h2><p>Clear the search.</p></article>`;
}
document.getElementById("q").addEventListener("input", paint);
document.getElementById("sort").addEventListener("change", paint);
document.getElementById("kinds").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  kind = b.dataset.k;
  paintKinds();
  paint();
});
fetch("api/library.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  lib = d;
  paintKinds();
  paint();
}).catch(() => { paintKinds(); paint(); });
</script>
</body>
</html>
