<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03040a">
  <title>Loop · VOIDD</title>
  <meta name="description" content="Lift so high the car goes inverted and looks backward. Our rail.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../gold.css">
  <style>
    .stage { margin: 1.1rem 0 1.2rem; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #05060c; }
    canvas { display: block; width: 100%; height: auto; touch-action: none; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; margin: .8rem 0 1.4rem; }
    .stat { color: var(--dim); font-size: .88rem; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main</a>
  <div class="wrap">
    <header class="top">
      <a class="mark" href="../index.html"><span class="ring" aria-hidden="true"></span>VOIDD</a>
      <nav>
        <a href="../index.html">Work</a>
        <a href="../tools/index.html">Tools</a>
        <a href="loop.html" aria-current="page">Loop</a>
        <a href="../store.html">Shop</a>
      </nav>
    </header>
    <main id="main">
      <p class="place">Ride · our rail</p>
      <h1>So up it turns over.</h1>
      <p class="lede">The lift keeps climbing until the car is upside down and the heading reads backward. Then the drop. Then again.</p>
      <div class="stage"><canvas id="c" width="960" height="540" aria-label="Inverted rollercoaster"></canvas></div>
      <div class="row">
        <button class="btn" type="button" id="boost">Boost</button>
        <button class="btn ghost" type="button" id="reset">Reset lean</button>
        <span class="stat" id="stat">lap 0</span>
      </div>
    </main>
    <footer>
      <span>VOIDD Labs</span>
      <a href="../about.html">About</a>
      <a href="../call.html">Contact</a>
    </footer>
  </div>
  <script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  let t = 0, lean = 0, boost = 0, laps = 0, lastU = 0;

  function rail(u) {
    u = ((u % 1) + 1) % 1;
    const liftX0 = 70, ground = 470, peak = 48;
    const loopR = 86, loopCx = 620, loopCy = 470 - loopR;
    let x, y;
    if (u < 0.28) {
      const k = u / 0.28;
      const rise = Math.pow(k, 1.35);
      x = liftX0 + k * 360;
      y = ground - rise * (ground - peak);
    } else if (u < 0.36) {
      const k = (u - 0.28) / 0.08;
      x = 430 + k * 70;
      y = peak + k * 18;
    } else if (u < 0.48) {
      const k = (u - 0.36) / 0.12;
      x = 500 + k * 34;
      y = 66 + k * ((loopCy + loopR) - 66);
    } else if (u < 0.86) {
      const k = (u - 0.48) / 0.38;
      const th = -Math.PI / 2 + k * Math.PI * 2;
      x = loopCx + Math.cos(th) * loopR;
      y = loopCy + Math.sin(th) * loopR;
    } else {
      const k = (u - 0.86) / 0.14;
      x = loopCx + loopR + k * (liftX0 + W - 40 - (loopCx + loopR));
      y = ground - Math.sin(k * Math.PI) * 28;
      if (k > 0.72) {
        const r = (k - 0.72) / 0.28;
        x = x * (1 - r) + liftX0 * r;
        y = y * (1 - r) + ground * r;
      }
    }
    return { x, y };
  }

  function heading(u) {
    const a = rail(u), b = rail(u + 0.003);
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  function draw() {
    t += 0.011 + boost;
    boost *= 0.965;
    const u = (t % (Math.PI * 2)) / (Math.PI * 2);
    if (u < lastU) laps++;
    lastU = u;
    ctx.fillStyle = "#05060c";
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a0b3a");
    g.addColorStop(0.35, "#05060c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.beginPath();
    for (let i = 0; i <= 220; i++) {
      const p = rail(i / 220);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = "#1a1e2d";
    ctx.lineWidth = 20;
    ctx.stroke();
    ctx.strokeStyle = "#a06cff";
    ctx.lineWidth = 3;
    ctx.stroke();
    const car = rail(u);
    const ang = heading(u) + lean;
    const inverted = u > 0.55 && u < 0.78;
    const backward = inverted && Math.cos(ang) < 0;
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(ang);
    ctx.fillStyle = inverted ? "#c4a2ff" : "#43def5";
    ctx.fillRect(-18, -7, 36, 14);
    ctx.fillStyle = "#f7f6ff";
    ctx.fillRect(10, -5, 8, 10);
    ctx.restore();
    const pose = inverted ? (backward ? "upside down · heading back" : "upside down") : "upright";
    document.getElementById("stat").textContent = "lap " + laps + " · " + pose;
    requestAnimationFrame(draw);
  }
  canvas.addEventListener("pointermove", e => {
    const r = canvas.getBoundingClientRect();
    lean = ((e.clientX - r.left) / r.width - 0.5) * 0.7;
  });
  document.getElementById("boost").onclick = () => { boost = 0.035; };
  document.getElementById("reset").onclick = () => { lean = 0; };
  draw();
  </script>
</body>
</html>
