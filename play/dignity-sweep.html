<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGNITY SWEEP — VOIDD</title>
<style>
:root{--bg:#0a0a0f;--c:#22d3ee;--ink:#f4f4f5;--dim:#a1a1aa}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,monospace;max-width:440px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;letter-spacing:.14em}
h1{font-size:22px}h1 b{color:var(--c)}
p{color:var(--dim);font-size:12px;margin:6px 0 8px}
#hud{color:var(--c);font-size:11px;letter-spacing:.12em;margin-bottom:6px}
canvas{width:100%;background:#08080c;border:1px solid rgba(34,211,238,.3);touch-action:none;display:block}
.row{display:flex;gap:8px;margin-top:8px}
button{flex:1;background:0;color:var(--ink);border:1px solid rgba(255,255,255,.15);padding:10px;font:inherit;letter-spacing:.14em}
</style>
</head>
<body>
<div class="top"><span>DS · VOIDD</span><span id="st">IDLE</span></div>
<h1>DIGNITY <b>SWEEP</b></h1>
<p>Hold to vacuum. Drag to aim. Aliens clip you. 3 lives.</p>
<div id="hud">SCORE 0 · LIVES 3 · WAVE 1</div>
<canvas id="c" width="400" height="540"></canvas>
<div class="row"><button id="go">GO</button><button id="rs">RESET</button></div>
<script>
const C=document.getElementById("c"),X=C.getContext("2d"),W=400,H=540;
let run=0,hold=0,score=0,lives=3,wave=1,t=0,px=200,coins=[],robs=[],vac=0;
const hud=()=>document.getElementById("hud").textContent="SCORE "+score+" · LIVES "+lives+" · WAVE "+wave;
const st=s=>document.getElementById("st").textContent=s;
function reset(){run=hold=score=t=vac=0;lives=3;wave=1;px=200;coins=[];robs=[];hud();st("IDLE");draw()}
function add(){
  if(t%(Math.max(16,36-wave*2)|0)===0) coins.push({x:24+Math.random()*352,y:-8,v:1.4+wave*.18});
  if(t%(Math.max(64,110-wave*5)|0)===0) robs.push({x:Math.random()<.5?-18:418,y:430+Math.random()*50,d:Math.random()<.5?1:-1});
}
function step(){
  if(!run)return;
  t++; if(t%420===0) wave++;
  add();
  vac=hold?Math.min(1,vac+.1):Math.max(0,vac-.12);
  const top=480-vac*200;
  coins=coins.filter(c=>{
    c.y+=c.v;
    if(vac>.15 && Math.abs(c.x-px)<34 && c.y>top && c.y<500){score+=10;hud();return 0}
    return c.y<H+12;
  });
  robs=robs.filter(r=>{
    r.x+=r.d*(2+wave*.16);
    if(Math.abs(r.x-px)<20 && Math.abs(r.y-490)<18){lives--;hud();return 0}
    return r.x>-30&&r.x<430;
  });
  if(lives<=0){run=0;st("FAILED")}
  draw();requestAnimationFrame(step);
}
function draw(){
  X.fillStyle="#08080c";X.fillRect(0,0,W,H);
  X.strokeStyle="rgba(34,211,238,.1)";
  for(let y=0;y<H;y+=24){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
  if(vac){
    const top=480-vac*200;
    X.fillStyle="rgba(34,211,238,.14)";
    X.beginPath();X.moveTo(px-14,490);X.lineTo(px+14,490);X.lineTo(px+40,top);X.lineTo(px-40,top);X.fill();
  }
  X.fillStyle="#facc15";
  coins.forEach(c=>{X.beginPath();X.arc(c.x,c.y,6,0,7);X.fill()});
  X.font="20px sans-serif";
  robs.forEach(r=>X.fillText("👽",r.x-12,r.y+8));
  X.fillText("🤖",px-12,498);
  if(!run){
    X.fillStyle="rgba(8,8,12,.72)";X.fillRect(0,220,W,70);
    X.fillStyle="#67e8f9";X.font="14px ui-monospace";X.textAlign="center";
    X.fillText(lives<=0?"FAILED · RESET":"HOLD TO VACUUM",W/2,260);
    X.textAlign="start";
  }
}
function ptr(e){
  const r=C.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  px=Math.max(18,Math.min(382,(src.clientX-r.left)*W/r.width));
}
C.onpointerdown=e=>{hold=1;try{C.setPointerCapture(e.pointerId)}catch(err){}ptr(e)};
C.onpointermove=ptr;
C.onpointerup=()=>hold=0;
document.getElementById("go").onclick=()=>{if(!run){if(lives<=0)reset();run=1;st("LIVE");step()}};
document.getElementById("rs").onclick=reset;
reset();
</script>
</body>
</html>
