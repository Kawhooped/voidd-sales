<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeminiForge · VOIDD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
  <style>body{font-family:Inter,sans-serif}.gemini-gradient-text{background:linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.gemini-gradient-bg{background:linear-gradient(135deg,#2563eb,#7c3aed,#db2777)}.glass-panel{background:rgba(30,41,59,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <header class="border-b border-slate-800 sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl gemini-gradient-bg flex items-center justify-center text-white"><i class="fa-solid fa-sparkles"></i></div>
        <div>
          <div class="flex items-center gap-2"><span class="font-bold text-lg">Gemini<span class="text-blue-400">Forge</span></span>
          <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Live</span></div>
          <p class="text-xs text-slate-400 hidden sm:block">VOIDD Pages · Kawhooped/gemini-forge</p>
        </div>
      </div>
      <button onclick="openKeyModal()" id="apiKeyBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span id="apiKeyStatusText">Set API key</span>
      </button>
    </div>
  </header>
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
    <div class="glass-panel rounded-2xl p-5">
      <h1 class="text-2xl font-bold mb-1">Build with the <span class="gemini-gradient-text">Gemini Multimodal API</span></h1>
      <p class="text-slate-400 text-sm max-w-2xl">Chat, search grounding, structured JSON, image generation, and TTS. Paste a Google AI Studio key to run the live endpoints.</p>
    </div>
    <div class="flex gap-2 overflow-x-auto border-b border-slate-800 text-sm">
      <button onclick="switchTab('chat')" id="tab-chat" class="tab-btn px-4 py-2.5 border-b-2 border-blue-500 text-blue-400">1. Chat</button>
      <button onclick="switchTab('grounding')" id="tab-grounding" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-slate-400">2. Grounding</button>
      <button onclick="switchTab('json')" id="tab-json" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-slate-400">3. JSON</button>
      <button onclick="switchTab('image')" id="tab-image" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-slate-400">4. Image</button>
      <button onclick="switchTab('tts')" id="tab-tts" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-slate-400">5. TTS</button>
    </div>
    <div id="view-chat" class="tab-view grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="glass-panel rounded-2xl p-5 space-y-3">
        <label class="text-xs font-semibold">System instruction</label>
        <textarea id="chatSystemPrompt" rows="4" class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3 text-xs">You are an expert AI assistant that delivers sharp, accurate answers.</textarea>
      </div>
      <div class="lg:col-span-2 glass-panel rounded-2xl flex flex-col h-[520px] overflow-hidden">
        <div id="chatHistoryBox" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm text-slate-300">Ready. Set a key, then send a prompt.</div>
        <div class="p-3 border-t border-slate-800 flex gap-2">
          <input id="chatInput" onkeydown="if(event.key==='Enter')sendChatMessage()" class="flex-1 rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm" placeholder="Ask Gemini…">
          <button onclick="sendChatMessage()" id="chatSendBtn" class="px-4 py-3 rounded-xl bg-blue-600 text-white text-sm font-medium">Send</button>
        </div>
      </div>
    </div>
    <div id="view-grounding" class="tab-view hidden space-y-3">
      <div class="flex gap-2"><input id="groundingInput" class="flex-1 rounded-xl bg-slate-900 border border-slate-700 px-4 py-2.5 text-sm" value="What are the most notable AI releases right now?">
      <button onclick="runGroundingSearch()" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold">Search</button></div>
      <div id="groundingResultBox" class="min-h-[200px] rounded-xl bg-slate-900 border border-slate-800 p-4 text-sm text-slate-400">Idle</div>
      <div id="groundingSourcesList" class="text-xs text-slate-500"></div>
    </div>
    <div id="view-json" class="tab-view hidden space-y-3">
      <textarea id="jsonSchemaText" rows="8" class="w-full rounded-xl bg-slate-900 font-mono text-[11px] text-purple-300 border border-slate-700 p-3"></textarea>
      <div class="flex gap-2"><input id="jsonPromptInput" class="flex-1 rounded-xl bg-slate-900 border border-slate-700 px-4 py-2.5 text-sm" value="Generate a hearty carbonara recipe for two.">
      <button onclick="generateStructuredJson()" class="px-5 py-2.5 rounded-xl bg-purple-600 text-white text-sm font-semibold">Extract JSON</button></div>
      <pre id="rawJsonViewer" class="h-64 overflow-auto rounded-xl bg-slate-900 p-3 font-mono text-[11px] text-emerald-400 border border-slate-800">// JSON</pre>
    </div>
    <div id="view-image" class="tab-view hidden space-y-3">
      <div class="flex gap-2"><input id="imagePromptInput" class="flex-1 rounded-xl bg-slate-900 border border-slate-700 px-4 py-2.5 text-sm" value="A hyper-detailed 3D isometric laboratory">
      <button onclick="generateAiImage()" class="px-5 py-2.5 rounded-xl bg-pink-600 text-white text-sm font-semibold">Generate</button></div>
      <div id="imageDisplayContainer" class="min-h-[320px] rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center"><img id="renderedAiImage" class="hidden max-h-[360px] rounded-xl" alt="art"></div>
    </div>
    <div id="view-tts" class="tab-view hidden space-y-3">
      <select id="ttsVoiceSelect" class="rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 text-xs"><option>Kore</option><option>Puck</option><option>Zephyr</option><option>Charon</option></select>
      <textarea id="ttsScriptInput" rows="3" class="w-full rounded-xl bg-slate-900 border border-slate-700 p-3 text-sm">Say warmly: Welcome to GeminiForge on VOIDD Pages.</textarea>
      <button onclick="synthesizeSpeech()" class="px-6 py-2.5 rounded-xl bg-amber-600 text-white text-sm font-semibold">Synthesize</button>
      <audio id="ttsAudioPlayer" controls class="w-full hidden"></audio>
      <p id="ttsStatus" class="text-xs text-slate-500">Ready</p>
    </div>
  </main>
  <div id="keyModal" class="fixed inset-0 z-50 bg-slate-950/80 hidden items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl p-6 space-y-3">
      <h3 class="font-bold">API key</h3>
      <input type="password" id="customApiKeyInput" placeholder="AIzaSy…" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-xs font-mono">
      <div class="flex justify-end gap-2"><button onclick="closeKeyModal()" class="px-3 py-1.5 text-xs">Cancel</button><button onclick="saveCustomKey()" class="px-4 py-1.5 rounded-lg bg-blue-600 text-xs text-white">Save</button></div>
    </div>
  </div>
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2"></div>
  <script>
  let customApiKey = localStorage.getItem('gf_key') || '';
  function getActiveApiKey(){return customApiKey||'';}
  function showToast(m){const c=document.getElementById('toastContainer');const d=document.createElement('div');d.className='px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs';d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),3000);}
  function switchTab(id){document.querySelectorAll('.tab-view').forEach(v=>v.classList.add('hidden'));document.getElementById('view-'+id).classList.remove('hidden');}
  function openKeyModal(){document.getElementById('keyModal').classList.remove('hidden');document.getElementById('keyModal').classList.add('flex');document.getElementById('customApiKeyInput').value=customApiKey;}
  function closeKeyModal(){document.getElementById('keyModal').classList.add('hidden');document.getElementById('keyModal').classList.remove('flex');}
  function saveCustomKey(){customApiKey=document.getElementById('customApiKeyInput').value.trim();localStorage.setItem('gf_key',customApiKey);document.getElementById('apiKeyStatusText').textContent=customApiKey?'Key set':'Set API key';closeKeyModal();showToast('Key saved locally');}
  async function geminiFetch(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return r.json();}
  function api(model){return 'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+getActiveApiKey();}
  async function sendChatMessage(){
    const text=document.getElementById('chatInput').value.trim(); if(!text)return;
    const box=document.getElementById('chatHistoryBox'); box.innerHTML+='<div class="text-right text-blue-300">'+text.replace(/</g,'&lt;')+'</div>';
    document.getElementById('chatInput').value='';
    try{
      const data=await geminiFetch(api('gemini-3-flash-preview'),{contents:[{parts:[{text}]}],systemInstruction:{parts:[{text:document.getElementById('chatSystemPrompt').value}]}});
      const t=data?.candidates?.[0]?.content?.parts?.[0]?.text||JSON.stringify(data);
      box.innerHTML+='<div class="whitespace-pre-wrap">'+String(t).replace(/</g,'&lt;')+'</div>';
    }catch(e){box.innerHTML+='<div class="text-rose-400">'+e.message+'</div>';}
  }
  async function runGroundingSearch(){
    const q=document.getElementById('groundingInput').value.trim();
    const box=document.getElementById('groundingResultBox'); box.textContent='Searching…';
    try{
      const data=await geminiFetch(api('gemini-3-flash-preview'),{contents:[{parts:[{text:q}]}],tools:[{google_search:{}}]});
      const c=data?.candidates?.[0]; box.textContent=c?.content?.parts?.[0]?.text||JSON.stringify(data);
    }catch(e){box.textContent=e.message;}
  }
  const defaultSchema={type:'OBJECT',properties:{dishName:{type:'STRING'},prepTimeMinutes:{type:'INTEGER'},servings:{type:'INTEGER'},ingredients:{type:'ARRAY',items:{type:'OBJECT',properties:{item:{type:'STRING'},quantity:{type:'STRING'}}}},instructions:{type:'ARRAY',items:{type:'STRING'}}},required:['dishName','ingredients','instructions']};
  document.getElementById('jsonSchemaText').value=JSON.stringify(defaultSchema,null,2);
  async function generateStructuredJson(){
    const prompt=document.getElementById('jsonPromptInput').value.trim();
    const schema=JSON.parse(document.getElementById('jsonSchemaText').value);
    const data=await geminiFetch(api('gemini-3-flash-preview'),{contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',responseSchema:schema}});
    const raw=data?.candidates?.[0]?.content?.parts?.[0]?.text||JSON.stringify(data,null,2);
    document.getElementById('rawJsonViewer').textContent=raw;
  }
  async function generateAiImage(){
    const prompt=document.getElementById('imagePromptInput').value.trim();
    const data=await geminiFetch(api('gemini-3.1-flash-image'),{contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseModalities:['IMAGE'],imageConfig:{aspectRatio:'1:1'}}});
    const part=data?.candidates?.[0]?.content?.parts?.find(p=>p.inlineData);
    if(!part){showToast('No image returned');return;}
    const img=document.getElementById('renderedAiImage'); img.src='data:'+(part.inlineData.mimeType||'image/png')+';base64,'+part.inlineData.data; img.classList.remove('hidden');
  }
  function pcmToWav(pcm16,rate){const buf=new ArrayBuffer(44+pcm16.length*2);const v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};w(0,'RIFF');v.setUint32(4,36+pcm16.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm16.length*2,true);for(let i=0;i<pcm16.length;i++)v.setInt16(44+i*2,pcm16[i],true);return new Blob([v],{type:'audio/wav'});}
  async function synthesizeSpeech(){
    const script=document.getElementById('ttsScriptInput').value.trim();
    const voice=document.getElementById('ttsVoiceSelect').value;
    const data=await geminiFetch(api('gemini-2.5-flash-preview-tts'),{contents:[{parts:[{text:script}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}},model:'gemini-2.5-flash-preview-tts'});
    const part=data?.candidates?.[0]?.content?.parts?.[0]; if(!part?.inlineData?.data){document.getElementById('ttsStatus').textContent='No audio';return;}
    const b=atob(part.inlineData.data); const bytes=new Uint8Array(b.length); for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);
    const wav=pcmToWav(new Int16Array(bytes.buffer),24000); const player=document.getElementById('ttsAudioPlayer'); player.src=URL.createObjectURL(wav); player.classList.remove('hidden'); player.play();
    document.getElementById('ttsStatus').textContent='Playing '+voice;
  }
  if(customApiKey) document.getElementById('apiKeyStatusText').textContent='Key set';
  </script>
</body>
</html>
