<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixie Seeker · VOIDD Labs</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../gold.css">
  <style>
    .seek { max-width: 1100px; }
    .seek h1 { margin: 0; }
    .hint { font: 12px/1.4 ui-monospace, monospace; color: var(--mute, #8b8896); margin: 8px 0 16px; }
    label { display:block; font:10px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:#8b8896; margin:12px 0 6px; }
    input[type=text] { width:100%; background:#0a0a12; color:#f7f6ff; border:1px solid #1a1e2d; border-radius:12px; padding:12px; font:13px/1.3 ui-monospace,monospace; }
    .fields { display:grid; gap:10px; }
    @media (min-width:800px) { .fields { grid-template-columns: 1.4fr 1fr 1fr; } }
    .acts { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    .acts button { border:0; border-radius:12px; padding:12px 16px; cursor:pointer; font:12px/1 ui-monospace,monospace; text-transform:uppercase; }
    .go { background:#c4a2ff; color:#12081c; font-weight:700; }
    .go[disabled] { opacity:.5; }
    .ghost { background:#111; color:#a1a1aa; border:1px solid #1a1e2d; }
    .sys { font:11px/1.4 ui-monospace,monospace; color:#8b8896; min-height:1.4em; }
    .lineage, .learned { display:flex; gap:8px; overflow-x:auto; min-height:72px; padding:10px; border:1px solid #1a1e2d; border-radius:14px; background:#0a0a12; margin-top:12px; }
    .lineage img { width:64px; height:64px; object-fit:cover; border-radius:10px; }
    .chip { font:11px ui-monospace,monospace; border:1px solid #1a1e2d; border-radius:999px; padding:6px 10px; color:#c4a2ff; white-space:nowrap; }
    .chip.lock { background:#143028; color:#34d399; }
    .wait { color:#8b8896; font:12px ui-monospace,monospace; align-self:center; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .card { background:#0a0a12; border:1px solid #1a1e2d; border-radius:16px; overflow:hidden; }
    .card.ready { cursor:pointer; }
    .card.ready:hover { border-color:#a06cff; }
    .frame { aspect-ratio:1; background:#07070c; position:relative; display:grid; place-items:center; }
    .frame img { width:100%; height:100%; object-fit:cover; display:none; }
    .frame.ok img { display:block; }
    .stat { position:absolute; inset:0; display:grid; place-items:center; font:12px/1.4 ui-monospace,monospace; color:#8b8896; padding:16px; text-align:center; }
    .frame.ok .stat { display:none; }
    .meta { padding:10px 12px; }
    .meta b { display:block; font-weight:500; }
    .meta small { display:block; color:#8b8896; font:10px/1.3 ui-monospace,monospace; margin-top:4px; }
  </style>
</head>
<body>
  <div class="wrap seek">
    <header>
      <div class="top">
        <a class="mark" href="../index.html"><span class="ring" aria-hidden="true"></span>VOIDD</a>
        <nav>
          <a href="../index.html">Work</a>
          <a href="index.html">Tools</a>
          <a href="../store.html">Shop</a>
        </nav>
      </div>
      <p class="place">Seek</p>
      <h1>Pixie Seeker.</h1>
    </header>
    <p class="hint">Click a loaded tile to breed toward it. Same trait twice locks. Pollinations, no key. First image can take ~15s.</p>
    <div class="fields">
      <div>
        <label>Core</label>
        <input id="core" type="text" value="pixie, small forest creature, two legs with feet, butterfly wings">
      </div>
      <div>
        <label>Locked anatomy</label>
        <input id="lock" type="text" value="two legs, two arms, clear anatomy">
      </div>
      <div>
        <label>Avoid</label>
        <input id="neg" type="text" value="fused legs, mermaid tail, blurry, extra limbs, distorted face">
      </div>
    </div>
    <label>Variation <span id="strv">62</span></label>
    <input id="str" type="range" min="0" max="100" value="62" style="width:100%">
    <div class="acts">
      <button class="go" id="genbtn" type="button">Generate</button>
      <button class="ghost" id="reset" type="button">Reset</button>
      <span class="hint" id="genlab" style="margin:0;align-self:center">GEN 0</span>
    </div>
    <p class="sys" id="sys"></p>
    <div class="lineage" id="lineage"><span class="wait">No picks yet.</span></div>
    <div class="learned" id="learned"><span class="wait">No traits learned.</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const STARTER = [
      {label:"Orange Monarch", detail:"orange butterfly wings, translucent, monarch pattern"},
      {label:"Moss Sprite", detail:"green skin teal hair, moss texture, bark freckles"},
      {label:"Leaf Couture", detail:"wearing leaf clothes, acorn hat, vine belt"},
      {label:"Glow Glade", detail:"glowing forest background, fireflies, bokeh, magical light"}
    ];
    const POOL = STARTER.concat([
      {label:"Blue Moth", detail:"blue moth wings, dusty, luna moth texture"},
      {label:"Crystal Wings", detail:"crystal dragonfly wings, iridescent, prismatic"},
      {label:"Petal Pink", detail:"pink fairy wings, petal shaped, soft glow"},
      {label:"Silver Wisp", detail:"pale skin silver hair, moonlight sheen"},
      {label:"Bark Child", detail:"bark skin leaf hair, wooden joints"},
      {label:"Amber Heart", detail:"amber skin, warm light, honey freckles"},
      {label:"Mushroom Dress", detail:"wearing mushroom cap dress, spotted red cap"},
      {label:"Vine Armor", detail:"wearing vine armor, thorn details"},
      {label:"Misty Swamp", detail:"misty swamp background, fog, lily pads"},
      {label:"Meadow Sun", detail:"sunlit meadow background, tall grass, golden hour"},
      {label:"Deep Woods", detail:"dark enchanted forest, ancient trees, shadows"}
    ]);
    let gen = 0, picks = [], learned = {}, tiles = [], busy = false;
    const $ = (id) => document.getElementById(id);
    $("str").oninput = () => $("strv").textContent = $("str").value;
    function urlFor(prompt, seed) {
      const t = prompt.replace(/&/g, " and ").slice(0, 400);
      return "https://image.pollinations.ai/prompt/" + encodeURIComponent(t) +
        "?seed=" + seed + "&width=512&height=512&nologo=true&enhance=true";
    }
    function join(parts) {
      return parts.map(s => String(s || "").trim()).filter(Boolean).join(", ").replace(/,\s*,/g, ",");
    }
    function lockedDetails() {
      return Object.entries(learned).filter(([, n]) => n >= 2).map(([lab]) => {
        const hit = POOL.find(p => p.label === lab);
        return hit ? hit.detail : lab;
      }).join(", ");
    }
    function pickPool() {
      if (gen <= 1) return STARTER.slice();
      const used = new Set(Object.entries(learned).filter(([, n]) => n >= 2).map(([k]) => k));
      const rest = POOL.filter(p => !used.has(p.label)).sort(() => Math.random() - .5);
      return rest.slice(0, 4).concat(STARTER).slice(0, 4);
    }
    function generate() {
      if (busy) return;
      busy = true;
      $("genbtn").disabled = true;
      gen += 1;
      $("genlab").textContent = "GEN " + gen;
      const core = $("core").value, lock = $("lock").value, neg = $("neg").value;
      const strength = +$("str").value;
      const last = picks[picks.length - 1];
      const learnedBits = lockedDetails();
      const lastBit = last && strength > 20 ? last.detail : "";
      const pool = pickPool();
      tiles = pool.map((p, i) => {
        const seed = Math.floor(Date.now() / 1000) + i + gen * 97 + Math.floor(Math.random() * 999);
        let bits;
        if (strength < 35) bits = [core, lock, learnedBits, p.detail];
        else if (strength < 70) bits = [core, lock, learnedBits, lastBit, p.detail];
        else bits = [core, lock, learnedBits, lastBit, p.detail, "consistent character"];
        const prompt = join([...bits, "sharp focus, highly detailed" + (neg ? ", avoid " + neg : ""), "pixie portrait, centered, full body visible"]);
        return { ...p, seed, prompt, url: urlFor(prompt, seed), state: "loading", tries: 0 };
      });
      $("sys").textContent = join([core, lock, learnedBits, lastBit]);
      render();
    }
    function breed(t) {
      if (t.state !== "ok") return;
      picks.push(t);
      learned[t.label] = (learned[t.label] || 0) + 1;
      renderLine();
      busy = false;
      generate();
    }
    function renderLine() {
      $("lineage").innerHTML = picks.length
        ? picks.map(p => '<img src="' + p.url + '" alt="">').join("")
        : '<span class="wait">No picks yet.</span>';
      const entries = Object.entries(learned);
      $("learned").innerHTML = entries.length
        ? entries.sort((a,b) => b[1]-a[1]).map(([k,n]) =>
            '<span class="chip' + (n>=2 ? ' lock' : '') + '">' + k + (n>=2 ? ' locked' : ' ×' + n) + '</span>'
          ).join("")
        : '<span class="wait">No traits learned.</span>';
    }
    function doneMaybe() {
      if (tiles.length && tiles.every(t => t.state !== "loading")) {
        busy = false;
        $("genbtn").disabled = false;
      }
    }
    function render() {
      renderLine();
      $("grid").innerHTML = tiles.map((t, i) =>
        '<article class="card' + (t.state === "ok" ? " ready" : "") + '" data-i="' + i + '">' +
          '<div class="frame' + (t.state === "ok" ? " ok" : "") + '" id="fr' + i + '">' +
            '<div class="stat" id="st' + i + '">' + (t.state === "error" ? "Failed · tap Generate" : "Waiting on Pollinations…") + "</div>" +
            '<img alt="" id="im' + i + '">' +
          "</div>" +
          '<div class="meta"><b>' + t.label + "</b><small>" + t.detail + "</small></div>" +
        "</article>"
      ).join("");
      tiles.forEach((t, i) => {
        const img = document.getElementById("im" + i);
        const card = $("grid").querySelector('[data-i="' + i + '"]');
        card.onclick = () => breed(t);
        img.onload = () => { t.state = "ok"; document.getElementById("fr" + i).classList.add("ok"); card.classList.add("ready"); doneMaybe(); };
        img.onerror = () => {
          if (t.tries < 1) {
            t.tries += 1;
            t.url = urlFor(t.prompt, t.seed + 17);
            img.src = t.url;
            return;
          }
          t.state = "error";
          document.getElementById("st" + i).textContent = "Failed · tap Generate";
          doneMaybe();
        };
        img.src = t.url;
      });
    }
    $("genbtn").onclick = generate;
    $("reset").onclick = () => { gen = 0; picks = []; learned = {}; tiles = []; busy = false; $("genbtn").disabled = false; renderLine(); $("grid").innerHTML = ""; $("sys").textContent = ""; $("genlab").textContent = "GEN 0"; };
    generate();
  </script>
</body>
</html>
