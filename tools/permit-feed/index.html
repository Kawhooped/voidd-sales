<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permit feed · VOIDD</title>
  <meta name="description" content="Search sample Chicago building permits. Demo. Not a live city feed.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../gold.css">
  <style>
    .wrap { max-width: 40rem; margin: 0 auto; padding: 1.2rem 1.2rem 3.5rem; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    h1 { max-width: none; }
    label { display: block; margin: 1rem 0 0.35rem; color: var(--dim); font-size: 0.88rem; }
    input {
      width: 100%; padding: 0.55rem 0.7rem; border-radius: 6px;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      font: inherit;
    }
    #out { margin-top: 1rem; }
    .row {
      border: 1px solid var(--line); border-radius: 8px;
      padding: 0.75rem 0.85rem; margin: 0.55rem 0; background: var(--panel);
    }
    .row b { color: var(--gold-hot); }
    .muted { color: var(--dim); }
    footer { display: flex; flex-wrap: wrap; gap: 0.8rem 1.4rem; margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <a class="skip" href="#q">Skip to search</a>
  <div class="wrap">
    <header>
      <div class="top">
        <a class="mark" href="../../store.html">VOIDD Labs</a>
        <nav>
          <a href="../../store.html">Store</a>
          <a href="../" aria-current="page">Tools</a>
          <a href="../../license.html">License</a>
          <a href="tel:+17866601778">Contact</a>
        </nav>
      </div>
    </header>
    <main>
      <h1>Permit feed</h1>
      <p>Search the sample public permits. No account. No call to city hall. This is not a live feed for every city.</p>
      <label for="q">Search</label>
      <input id="q" type="search" placeholder="address, permit, owner, work…">
      <div id="out" class="muted">loading…</div>
    </main>
    <footer>
      <a href="../../store.html">Store</a>
      <a href="../../license.html">License</a>
    </footer>
  </div>
  <script>
    function text(el, value) { el.textContent = value == null ? "" : String(value); }
    function rowEl(r) {
      const row = document.createElement("div");
      row.className = "row";
      const b = document.createElement("b");
      text(b, r.permit || "");
      row.append(b, document.createTextNode(" · " + (r.status || "")));
      const addr = document.createElement("div");
      text(addr, r.address || "");
      const work = document.createElement("div");
      const kind = r.work_type || "";
      const desc = String(r.work || "").slice(0, 180);
      text(work, kind ? kind + " — " + desc : desc);
      row.append(addr, work);
      return row;
    }
    fetch("mep.json").then(r => r.ok ? r.json() : Promise.reject()).then(d => {
      const rows = d.rows || [];
      const out = document.getElementById("out");
      function show(list) {
        out.replaceChildren();
        const slice = list.slice(0, 40);
        if (!slice.length) {
          out.className = "muted";
          text(out, "no rows");
          return;
        }
        out.className = "";
        for (const r of slice) out.append(rowEl(r));
      }
      show(rows);
      document.getElementById("q").addEventListener("input", e => {
        const t = e.target.value.toLowerCase();
        show(rows.filter(r => JSON.stringify(r).toLowerCase().includes(t)));
      });
    }).catch(() => {
      const out = document.getElementById("out");
      out.className = "muted";
      text(out, "Sample data is missing from this copy. Need mep.json next to this page.");
    });
  </script>
</body>
</html>
