<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech · VOIDD</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../gold.css">
  <style>
    body{margin:0;background:#03040a;color:#f7f6ff;font:16px/1.45 system-ui,sans-serif}
    main{max-width:40rem;margin:0 auto;padding:1.25rem}
    h1{font-size:1.6rem;margin:.2rem 0}
    p.lead{color:#b8b4c8;margin:0 0 1rem}
    label{display:block;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:#8a86a0;margin:0.9rem 0 .3rem}
    textarea,select,input{width:100%;box-sizing:border-box;background:#0c0e16;color:#f7f6ff;border:1px solid #1a1e2d;border-radius:10px;padding:.7rem .8rem;font:inherit}
    textarea{min-height:7rem;resize:vertical}
    .row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
    button{min-height:44px;padding:.7rem 1.1rem;border:0;border-radius:10px;background:#a06cff;color:#fff;font-weight:650;cursor:pointer}
    button.ghost{background:#1a1e2d;color:#f7f6ff}
    button:disabled{opacity:.45;cursor:not-allowed}
    #status{font-size:.85rem;color:#8a86a0;margin-top:.8rem;min-height:1.2em}
    #status.err{color:#ff8a9a}
    audio{width:100%;margin-top:.8rem}
    .meta{font-size:.8rem;color:#8a86a0;margin-top:1.4rem}
    a{color:#43def5}
  </style>
</head>
<body>
<main>
  <p class="meta"><a href="index.html">Tools</a></p>
  <h1>Speech</h1>
  <p class="lead">Type words. Hear them. The voice engine is a plug, not the product.</p>

  <label for="text">Text</label>
  <textarea id="text">Welcome to VOIDD Speech. The tool is ours. The model can change.</textarea>

  <label for="provider">Engine</label>
  <select id="provider"></select>

  <label for="voice">Voice</label>
  <select id="voice"></select>

  <p id="keyRow" style="display:none">
    <label for="key">Remote key (saved only in this browser as gf_key)</label>
    <input id="key" type="password" autocomplete="off" placeholder="Paste key only for the remote engine">
  </p>

  <div class="row">
    <button id="go" type="button">Generate</button>
    <button id="dl" class="ghost" type="button" disabled>Download</button>
  </div>
  <audio id="player" controls hidden></audio>
  <p id="status">Ready.</p>
  <p class="meta">Device engine uses the browser. Remote engine uses Gemini TTS when a key is set. Architecture: capability, not vendor.</p>
</main>
<script>
const KEY = 'gf_key';
const player = document.getElementById('player');
const statusEl = document.getElementById('status');
const voiceSel = document.getElementById('voice');
const providerSel = document.getElementById('provider');
const keyRow = document.getElementById('keyRow');
const keyInput = document.getElementById('key');
const dl = document.getElementById('dl');
let lastBlob = null;
let lastUrl = null;

function setStatus(msg, err){
  statusEl.textContent = msg;
  statusEl.className = err ? 'err' : '';
}

function pcmToWav(pcm16, rate){
  const buf = new ArrayBuffer(44 + pcm16.length * 2);
  const v = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+pcm16.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,pcm16.length*2,true);
  for(let i=0;i<pcm16.length;i++) v.setInt16(44+i*2, pcm16[i], true);
  return new Blob([v], {type:'audio/wav'});
}

const PROVIDERS = {
  device: {
    id: 'device',
    label: 'Device (browser)',
    where: 'device',
    needsKey: false,
    async listVoices(){
      const wait = () => new Promise(res=>{
        const have = speechSynthesis.getVoices();
        if(have.length) return res(have);
        speechSynthesis.onvoiceschanged = () => res(speechSynthesis.getVoices());
        setTimeout(()=>res(speechSynthesis.getVoices()), 800);
      });
      const list = await wait();
      return list.map(v => ({ id: v.name, label: v.name + (v.lang ? ' · '+v.lang : '') }));
    },
    async synthesize({ text, voice }){
      return new Promise((resolve, reject) => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const match = speechSynthesis.getVoices().find(v => v.name === voice);
        if(match) u.voice = match;
        u.onend = () => resolve({ blob: null, mime: null, note: 'Played on device. No file from this engine.' });
        u.onerror = e => reject(new Error(e.error || 'device speech failed'));
        speechSynthesis.speak(u);
      });
    }
  },
  gemini: {
    id: 'gemini',
    label: 'Remote Gemini TTS',
    where: 'remote',
    needsKey: true,
    async listVoices(){
      return [
        { id: 'Kore', label: 'Kore' },
        { id: 'Puck', label: 'Puck' },
        { id: 'Zephyr', label: 'Zephyr' },
        { id: 'Charon', label: 'Charon' }
      ];
    },
    async synthesize({ text, voice }){
      const key = (localStorage.getItem(KEY) || '').trim();
      if(!key) throw new Error('Remote engine needs a key. Paste it above.');
      const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=' + encodeURIComponent(key);
      const body = {
        contents: [{ parts: [{ text }] }],
        generationConfig: {
          responseModalities: ['AUDIO'],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice || 'Kore' } } }
        }
      };
      const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await r.json();
      const b64 = data?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
      if(!b64) throw new Error(data?.error?.message || 'No audio from remote engine');
      const raw = atob(b64);
      const bytes = new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++) bytes[i] = raw.charCodeAt(i);
      const blob = pcmToWav(new Int16Array(bytes.buffer), 24000);
      return { blob, mime: 'audio/wav', note: 'Remote inference. WAV at 24 kHz.' };
    }
  }
};

function currentProvider(){
  return PROVIDERS[providerSel.value] || PROVIDERS.device;
}

async function fillVoices(){
  const p = currentProvider();
  keyRow.style.display = p.needsKey ? 'block' : 'none';
  const voices = await p.listVoices();
  voiceSel.innerHTML = voices.map(v => '<option value="'+v.id.replace(/"/g,'')+'">'+v.label.replace(/</g,'')+'</option>').join('') || '<option>default</option>';
}

async function generate(){
  const text = document.getElementById('text').value.trim();
  if(!text){ setStatus('Enter text.', true); return; }
  lastBlob = null;
  if(lastUrl){ URL.revokeObjectURL(lastUrl); lastUrl = null; }
  player.hidden = true;
  dl.disabled = true;
  const p = currentProvider();
  setStatus('Running ' + p.where + ' inference…');
  document.getElementById('go').disabled = true;
  try{
    const out = await p.synthesize({ text, voice: voiceSel.value, style: '' });
    if(out.blob){
      lastBlob = out.blob;
      lastUrl = URL.createObjectURL(out.blob);
      player.src = lastUrl;
      player.hidden = false;
      player.play();
      dl.disabled = false;
    }
    setStatus(out.note || 'Done.');
  }catch(e){
    setStatus(e.message || String(e), true);
  }finally{
    document.getElementById('go').disabled = false;
  }
}

providerSel.innerHTML = Object.values(PROVIDERS).map(p => '<option value="'+p.id+'">'+p.label+'</option>').join('');
keyInput.value = localStorage.getItem(KEY) || '';
keyInput.addEventListener('change', () => {
  const v = keyInput.value.trim();
  if(v) localStorage.setItem(KEY, v);
});
providerSel.addEventListener('change', fillVoices);
document.getElementById('go').addEventListener('click', generate);
tdl = document.getElementById('dl');
dl.addEventListener('click', () => {
  if(!lastBlob) return;
  const a = document.createElement('a');
  a.href = lastUrl;
  a.download = 'speech.wav';
  a.click();
});
fillVoices();
</script>
</body>
</html>
