<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03040a">
  <title>Start · VOIDD</title>
  <meta name="description" content="Type what you want. One Start. Preview and download a page. No account.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../gold.css">
  <style>
    .hero { margin: 1.6rem 0 1.2rem; }
    .hero h1 { font-size: clamp(2.1rem, 7vw, 3.4rem); }
    .prompt-box {
      margin: 1.2rem 0 .8rem;
      padding: .55rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #070914;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .45rem;
    }
    .prompt-box textarea {
      min-height: 5.2rem; resize: vertical; margin: 0;
      border: 0; background: transparent; font-size: 1.02rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1.4rem; }
    .chip {
      appearance: none; border: 1px solid var(--line); background: #090c14;
      color: var(--dim); border-radius: 999px; padding: .35rem .7rem;
      font: 600 .82rem/1 system-ui; cursor: pointer;
    }
    .chip.on, .chip:hover { color: var(--ink); border-color: #383e53; }
    .desk { display: none; height: min(78dvh, 860px); margin: 1rem 0 1.4rem;
      border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      background: #06080e; grid-template-columns: 9.5rem 1fr 15rem; }
    .desk.on { display: grid; }
    .rail, .chat { background: #070914; border-right: 1px solid var(--line); overflow: auto; }
    .chat { border-right: 0; border-left: 1px solid var(--line); padding: .7rem; }
    .rail { padding: .7rem; font-size: .82rem; }
    .rail button {
      display: block; width: 100%; text-align: left; appearance: none;
      background: transparent; color: var(--dim); border: 0; padding: .35rem .2rem;
      cursor: pointer; font: inherit;
    }
    .rail button.on { color: var(--cyan); }
    .mid { display: flex; flex-direction: column; min-width: 0; }
    .midbar {
      display: flex; gap: .5rem; align-items: center; justify-content: space-between;
      padding: .45rem .7rem; border-bottom: 1px solid var(--line); font-size: .8rem; color: var(--dim);
    }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    .msg { margin: 0 0 .65rem; font-size: .84rem; color: var(--dim); }
    .msg b { color: var(--ink); font-weight: 650; }
    .stage { color: var(--muted2); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
    @media (max-width: 820px) {
      .desk { grid-template-columns: 1fr; height: auto; }
      .rail { display: none; }
      iframe { min-height: 22rem; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main</a>
  <div class="wrap wide">
    <header class="top">
      <a class="mark" href="../index.html"><span class="ring" aria-hidden="true"></span>VOIDD</a>
      <nav>
        <a href="../index.html">Work</a>
        <a href="index.html">Tools</a>
        <a href="start.html" aria-current="page">Start</a>
        <a href="../store.html">Shop</a>
        <a href="../codeshelf.html">CodeShelf</a>
      </nav>
    </header>

    <main id="main">
      <p class="place">Browser desk · no account</p>
      <section class="hero">
        <h1>What will you build?</h1>
        <p class="lede">Type it. Hit Start. Preview the page. Download the file. That is the whole loop. This tab does not rent a server.</p>
        <div class="prompt-box">
          <textarea id="idea" placeholder="A landing page for a Miami detail shop with a price list and a call button."></textarea>
          <button class="btn" type="button" id="go">Start</button>
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <div class="desk" id="desk" hidden>
        <aside class="rail">
          <p class="stage">Files</p>
          <button type="button" class="on" id="f-index">index.html</button>
          <button type="button" id="f-readme">README.md</button>
        </aside>
        <div class="mid">
          <div class="midbar">
            <span id="tabname">Preview · index.html</span>
            <span>
              <button class="btn ghost" type="button" id="dl" style="min-height:2.2rem;width:auto">Download</button>
            </span>
          </div>
          <iframe id="frame" title="Preview"></iframe>
        </div>
        <aside class="chat" id="chat"></aside>
      </div>
    </main>

    <footer>
      <span>VOIDD Labs</span>
      <a href="../about.html">About</a>
      <a href="../call.html">Contact</a>
      <a href="../license.html">License</a>
    </footer>
  </div>
  <script>
  const CHIPS = [
    ["Website", "A one-page site for a local shop. Name, three services, a price, one button."],
    ["Menu", "A dark food menu. Six dishes, prices, hours."],
    ["Link page", "A personal link page. Name, three links, Miami."],
    ["Price card", "A simple $19 product card. Title, three bullets, buy button."]
  ];
  const chips = document.getElementById("chips");
  const idea = document.getElementById("idea");
  CHIPS.forEach(([label, text]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label;
    b.onclick = () => { idea.value = text; [...chips.children].forEach(x => x.classList.remove("on")); b.classList.add("on"); };
    chips.appendChild(b);
  });

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function build(prompt) {
    const title = (prompt.split(/[.!?]/)[0] || "New page").slice(0, 72);
    const html = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(title)}</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#0b0d12;color:#f4f2ff}
  main{max-width:40rem;margin:0 auto;padding:2.2rem 1.1rem}
  h1{font-size:2rem;letter-spacing:-.04em;margin:0 0 .6rem}
  p{color:#b7b3c7}
  .btn{display:inline-block;margin-top:1rem;padding:.7rem 1rem;background:#a06cff;color:#111;text-decoration:none;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>${esc(title)}</h1>
  <p>${esc(prompt)}</p>
  <a class="btn" href="#">Do the next step</a>
</main>
</body>
</html>`;
    const readme = `# ${title}\n\nGenerated in VOIDD Start. One file. Open index.html.\n\nPrompt:\n${prompt}\n`;
    return { title, html, readme };
  }

  let files = { html: "", readme: "", title: "" };
  const desk = document.getElementById("desk");
  const frame = document.getElementById("frame");
  const chat = document.getElementById("chat");
  const tabname = document.getElementById("tabname");

  function log(who, text) {
    const p = document.createElement("p");
    p.className = "msg";
    p.innerHTML = "<b>" + who + "</b> " + esc(text);
    chat.appendChild(p);
    chat.scrollTop = chat.scrollHeight;
  }

  function show(which) {
    document.getElementById("f-index").classList.toggle("on", which === "html");
    document.getElementById("f-readme").classList.toggle("on", which === "readme");
    if (which === "html") {
      tabname.textContent = "Preview · index.html";
      frame.srcdoc = files.html;
    } else {
      tabname.textContent = "Preview · README.md";
      frame.srcdoc = "<pre style='padding:1rem;white-space:pre-wrap;font:14px/1.45 ui-monospace,Menlo,monospace'>" + esc(files.readme) + "</pre>";
    }
  }

  document.getElementById("f-index").onclick = () => show("html");
  document.getElementById("f-readme").onclick = () => show("readme");

  document.getElementById("go").onclick = () => {
    const prompt = idea.value.trim() || "A clean landing page with a title and one button.";
    files = build(prompt);
    desk.hidden = false;
    desk.classList.add("on");
    chat.innerHTML = "";
    log("You", prompt);
    log("Start", "Wrote index.html and README.md in this tab.");
    log("Start", "Not Replit. No cloud run. Download if you want the files.");
    show("html");
    desk.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  document.getElementById("dl").onclick = () => {
    const blob = new Blob([files.html], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    a.click();
    URL.revokeObjectURL(a.href);
    log("Start", "Downloaded index.html.");
  };
  </script>
</body>
</html>
